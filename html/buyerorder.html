<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportMarket - Buyer Orders Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Đảm bảo logo thương hiệu và các icon menu hiển thị đẹp */
        .logo-container img {
            object-fit: contain;
            max-height: 32px;
            width: auto;
        }

        .menu-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* Hiệu ứng khi active mục Orders */
        .active-link {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 flex min-h-screen">

    <aside class="w-64 bg-white border-r flex flex-col justify-between p-6 sticky h-screen top-0">
        <div>
            <div class="flex items-center gap-3 mb-10 logo-container">
                <img src="/icon/logo.png" alt="SportMarket Logo" class="w-8 h-8" onerror="this.src='https://ui-avatars.com/api/?name=SM&background=2563eb&color=fff'">
                <span class="text-xl font-bold text-slate-700">SportMarket</span>
            </div>
            
            <nav class="space-y-4">
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-blue-600 transition-colors">
                    <img src="/icon/marketplace.png" alt="Marketplace" class="menu-logo"> 
                    Marketplace
                </a>
                <a href="#" class="flex items-center gap-3 active-link p-2 -ml-2 rounded-lg">
                    <img src="/icon/orders.png" alt="Orders" class="menu-logo"> 
                    Orders
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-blue-600 transition-colors">
                    <img src="/icon/notification.png" alt="Notifications" class="menu-logo"> 
                    Notifications
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-blue-600 transition-colors">
                    <img src="/icon/messaging.png" alt="Messaging" class="menu-logo"> 
                    Messaging
                </a>
                <a href="#" class="flex items-center gap-3 text-gray-500 hover:text-blue-600 transition-colors">
                    <img src="/icon/scheduling.png" alt="Scheduling" class="menu-logo"> 
                    Scheduling
                </a>
            </nav>
        </div>

        <div class="flex items-center gap-3 border-t pt-4">
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">HC</div>
            <div>
                <p class="text-sm font-bold text-slate-800">Nguyễn Hà Chi</p>
                <p class="text-xs text-gray-400">Buyer</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-10">
        <header class="flex justify-between items-start mb-8">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Orders</h1>
                <div class="mt-4">
                    <h2 class="text-xl font-bold text-slate-800">All Orders</h2>
                    <p id="order-count" class="text-sm text-gray-400">0 orders found</p>
                </div>
            </div>
            
            <div class="relative w-80">
                <i class="lucide-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                <input id="search-input" type="text" placeholder="Search orders..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>
        </header>

        <div id="filter-container" class="flex gap-4 mb-8">
            <button class="filter-btn px-6 py-2 bg-blue-600 text-white rounded-lg font-medium transition-all shadow-sm" data-status="All">All</button>
            <button class="filter-btn px-6 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition-all" data-status="In Delivery">In Delivery</button>
            <button class="filter-btn px-6 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition-all" data-status="Delivered">Delivered</button>
            <button class="filter-btn px-6 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg hover:bg-gray-50 transition-all" data-status="Cancelled">Cancelled</button>
        </div>

        <div id="order-list" class="space-y-4">
            </div>
    </main>

    <script>
        const orders = [
            { id: 'ORD-2024-1847', name: 'Puma Speedcat Ballet Suede', price: '2.200.000 đ', date: '15 Jan 2024', status: 'In Delivery', time: '2 days ago', img: 'https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=200' },
            { id: 'ORD-2024-1846', name: 'New Balance 530', price: '1.800.000 đ', date: '14 Jan 2024', status: 'Delivered', time: '1 day ago', img: 'https://images.unsplash.com/photo-1539185441755-769473a23570?w=200' },
            { id: 'ORD-2024-1845', name: 'Giày leo núi nữ Humtto', price: '950.000 đ', date: '10 Jan 2024', status: 'Delivered', time: '5 days ago', img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200' },
            { id: 'ORD-2024-1844', name: 'Nike Air Jordan Pro', price: '4.500.000 đ', date: '12 Jan 2024', status: 'In Delivery', time: '3 days ago', img: 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=200' },
            { id: 'ORD-2024-1843', name: 'Adidas Ultraboost 22', price: '3.200.000 đ', date: '8 Jan 2024', status: 'Cancelled', time: '7 days ago', img: 'https://images.unsplash.com/photo-1587563871167-1ee9c731aefb?w=200' }
        ];

        let currentFilter = 'All';
        let searchQuery = '';

        function renderOrders() {
            const container = document.getElementById('order-list');
            const countElement = document.getElementById('order-count');
            
            const filtered = orders.filter(o => {
                const matchesF = currentFilter === 'All' || o.status === currentFilter;
                const matchesS = o.name.toLowerCase().includes(searchQuery.toLowerCase()) || o.id.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesF && matchesS;
            });

            countElement.innerText = `${filtered.length} orders found`;

            container.innerHTML = filtered.length === 0 ? 
                `<div class="text-center py-20 text-gray-400 italic">No orders found.</div>` :
                filtered.map(order => `
                <div class="bg-white p-4 rounded-xl border border-gray-100 flex items-center justify-between hover:shadow-md hover:border-blue-100 transition-all duration-300 group">
                    <div class="flex gap-4 items-center">
                        <img src="${order.img}" class="w-20 h-20 rounded-lg object-cover bg-gray-50 border">
                        <div>
                            <h3 class="font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${order.name}</h3>
                            <p class="text-xs text-gray-400 font-medium mt-1">${order.status} • ${order.time}</p>
                            <p class="text-blue-600 font-bold mt-2">${order.price}</p>
                        </div>
                    </div>
                    <div class="text-center">
                        <p class="font-bold text-sm text-slate-700">${order.id}</p>
                        <p class="text-xs text-gray-400 mt-1">${order.date}</p>
                    </div>
                    <div class="flex items-center gap-6">
                        <span class="px-4 py-1 text-[11px] font-bold rounded-full uppercase tracking-wider ${getStatusStyle(order.status)}">
                            ${order.status}
                        </span>
                        <button class="p-2 hover:bg-blue-50 rounded-lg text-gray-300 group-hover:text-blue-500 transition-all">
                            <i class="lucide-chevron-right w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusStyle(status) {
            if (status === 'In Delivery') return 'bg-orange-100 text-orange-600';
            if (status === 'Delivered') return 'bg-green-100 text-green-600';
            return 'bg-red-50 text-red-500';
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderOrders();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                    b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
                });
                this.classList.replace('bg-white', 'bg-blue-600');
                this.classList.replace('text-gray-600', 'text-white');
                this.classList.remove('border-gray-200');
                this.classList.add('shadow-sm');
                currentFilter = this.dataset.status;
                renderOrders();
            });
        });

        renderOrders();
    </script>
</body>
</html>
